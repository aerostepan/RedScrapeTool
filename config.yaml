topic: "AI video editing tools"
subreddits:
  - VideoEditing
  - NewTubers
  - ContentCreators
  - Entrepreneur
limit_per_query: 50
days_back: 90
output_path: "data/exports/reddit_market_research.xlsx"
fetch_mode: "auto"

search_phrases:
  - "I wish"
  - "why doesn't"
  - "why cant"
  - "why can't"
  - "alternative to"
  - "any tool for"
  - "is there a tool"
  - "looking for a tool"
  - "missing feature"
  - "too expensive"
  - "hate using"
  - "annoying"
  - "manual"
  - "takes too long"
  - "doesn't integrate"
  - "no integration"
  - "workaround"
  - "feature request"
  - "need software for"
  - "how do you manage"

reddit:
  user_agent: "market-research-tool/0.1 by local-user"
  use_rss: true
  use_oauth_fallback: true
  use_public_pages: true
  use_selenium_fallback: false
  use_cdp_fallback: false

browser_fallback:
  enabled: false
  headless: false
  timeout: 30
  min_delay_seconds: 10
  max_delay_seconds: 20
  scrolls_per_search: 2
  open_post_pages: true
  max_comments_per_post: 2
  max_queries_per_subreddit: 12
  sample_all_subreddits_first: true

redis:
  host: "localhost"
  port: 6379
  db: 0

ai:
  provider: "openai"
  model: "gpt-4.1-mini"
  temperature: 0
  max_items_per_batch: 10

notebooklm:
  enabled: true

local_exports:
  excel: true
  notebooklm_markdown: true

google_workspace:
  enabled: false
  reuse_notebook_source_doc: true
  share_with_link: false
  state_path: "data/published/google_resources.json"
  spreadsheet_title: "{topic} Product Discovery - {date}"
  notebook_source_title: "{topic} NotebookLM Source"

telegram:
  enabled: false
